---
# ============================================================
# 04 — DRBD configuration
# ============================================================
# Writes the resource definition, initialises metadata,
# brings the resource up, and formats the filesystem.
#
# KEY FIX: The original create-md step used a creates: guard
# checking for a file that doesn't exist on this DRBD version,
# making the idempotency check unreliable. We now check
# drbdadm status directly to skip create-md if the resource
# is already configured.
#
# KEY FIX: Filesystem type is xfs, not ext4. The original
# Vagrantfile formatted with xfs but the Pacemaker resource
# was configured for ext4, causing mount failures.
#
# KEY FIX: disk:Diskless state detected and treated as needing
# create-md — occurs when resource is known but has no metadata.
#
# KEY FIX: pause after create-md to allow metadata to settle
# before bringing the resource up.
#
# KEY FIX: drbdadm dump-md used to verify metadata actually
# exists on the physical disk — handles cases where the disk
# device changes (e.g. x86_64 vs aarch64 disk ordering) and
# DRBD knows the resource but has no metadata on the new disk.
#
# After this task runs:
#   drbdadm status r0   — shows Primary/Secondary and sync %
# ============================================================

- name: Deploy DRBD resource configuration
  template:
    src: drbd_resource.res.j2
    dest: "/etc/drbd.d/{{ drbd_resource_name }}.res"
    owner: root
    group: root
    mode: '0644'

- name: Check if DRBD resource is already configured
  command: drbdadm status {{ drbd_resource_name }}
  register: drbd_status_check
  changed_when: false
  failed_when: false
  # rc 0  = resource is up and configured
  # rc 10 = resource is known but down (needs 'up')
  # rc 20 = resource unknown (needs create-md)

- name: Check if DRBD metadata actually exists on disk
  command: drbdadm show {{ drbd_resource_name }}
  register: drbd_metadata_check
  changed_when: false
  failed_when: false
  # rc 0  = metadata exists on the configured disk
  # rc != 0 = no valid metadata found on disk
  # This catches cases where the disk device changed (e.g.
  # x86_64 vs aarch64 disk ordering) but DRBD still knows
  # the resource from its config file.

- name: Determine if DRBD metadata needs to be created
  set_fact:
    drbd_needs_metadata: >-
      {{ drbd_status_check.rc == 20 or
         'Diskless' in drbd_status_check.stdout or
         drbd_metadata_check.rc != 0 }}
  # True if:
  # - Resource is completely unknown (rc 20)
  # - Resource is up but disk is Diskless (no metadata)
  # - Metadata doesn't exist on the physical disk (dump-md fails)

- name: Bring DRBD resource down before creating metadata (if Diskless)
  command: drbdadm down {{ drbd_resource_name }}
  when: drbd_needs_metadata and drbd_status_check.rc == 0
  failed_when: false

- name: Create DRBD metadata on raw block device
  command: drbdadm create-md {{ drbd_resource_name }} --force
  when: drbd_needs_metadata
  # Only run if resource is completely unknown, Diskless,
  # or metadata doesn't exist on the physical disk.

- name: Wait for metadata to settle after create-md
  pause:
    seconds: 3
  when: drbd_needs_metadata
  # create-md writes metadata to disk — give it a moment
  # before attempting to bring the resource up.

- name: Bring DRBD resource up
  command: drbdadm up {{ drbd_resource_name }}
  register: drbd_up
  changed_when: drbd_up.rc == 0
  failed_when: drbd_up.rc not in [0, 10, 11]
  when: drbd_status_check.rc != 0 or drbd_needs_metadata
  # rc 10/11 = already up, which is fine

- name: Verify DRBD resource is up after bringing up
  command: drbdadm status {{ drbd_resource_name }}
  register: drbd_verify
  failed_when: drbd_verify.rc not in [0, 10]
  changed_when: false
  when: drbd_status_check.rc != 0 or drbd_needs_metadata
  # Confirm the resource came up successfully before proceeding

- name: Promote node1 to DRBD Primary and force initial sync
  command: drbdadm primary --force {{ drbd_resource_name }}
  when:
    - inventory_hostname == 'node1'
    - drbd_needs_metadata
  # Only on fresh setup. Pacemaker manages promotion after
  # the cluster is configured.

- name: Wait for DRBD to be ready for formatting (node1 only)
  command: drbdadm status {{ drbd_resource_name }}
  register: drbd_ready
  until: "'Primary' in drbd_ready.stdout"
  retries: 10
  delay: 3
  when:
    - inventory_hostname == 'node1'
    - drbd_needs_metadata
  changed_when: false

- name: Create XFS filesystem on DRBD device (node1 only)
  filesystem:
    fstype: "{{ drbd_filesystem }}"
    dev: "{{ drbd_device }}"
    force: false
  when:
    - inventory_hostname == 'node1'
    - drbd_needs_metadata
  # Only format on fresh setup and only on the Primary node.
  # node2 receives the filesystem via block-level replication.
  # KEY FIX: filesystem module uses mkfs.xfs under the hood.
  # Without this step Pacemaker cannot mount /dev/drbd0.

- name: Show DRBD sync status
  command: drbdadm status {{ drbd_resource_name }}
  register: drbd_status
  changed_when: false

- name: Display DRBD status
  debug:
    msg: "{{ drbd_status.stdout_lines }}"
