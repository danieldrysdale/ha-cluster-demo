---
# ============================================================
# 02 — Networking
# ============================================================
# Sets hostnames and writes /etc/hosts so nodes can reach
# each other by name. Required for Corosync and DRBD.
# ============================================================

- name: Set hostname on node1
  hostname:
    name: node1
  when: inventory_hostname == 'node1'

- name: Set hostname on node2
  hostname:
    name: node2
  when: inventory_hostname == 'node2'

- name: Write /etc/hosts with both node IPs
  template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'

- name: Create udev rule to identify DRBD disk by size
  copy:
    content: |
      # Identify the DRBD disk by size (5GB = 10485760 512-byte blocks)
      SUBSYSTEM=="block", KERNEL=="sd[a-z]", ATTR{size}=="10485760", SYMLINK+="drbd-disk"
    dest: /etc/udev/rules.d/99-drbd-disk.rules
    owner: root
    group: root
    mode: '0644'

- name: Reload udev rules and trigger
  shell: udevadm control --reload-rules && udevadm trigger
  changed_when: false
